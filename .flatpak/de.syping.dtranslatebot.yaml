app-id: de.syping.dtranslatebot
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: dtranslatebot
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: dpp
    buildsystem: cmake-ninja
    config-opts:
      - -DAVX_TYPE=AVX0
      - -DBUILD_VOICE_SUPPORT=OFF
      - -DDPP_BUILD_TEST=OFF
      - -DDPP_NO_CORO=ON
      - -DDPP_NO_VCPKG=ON
      - -DRUN_LDCONFIG=OFF
    sources:
      - type: archive
        url: https://github.com/brainboxdotcc/DPP/releases/download/v10.1.6/DPP-10.1.6.tar.gz
        sha256: 65cf9e5fbc7b40e3fadaf742fa87da9cdede46651e35007c7b45cb765bfc17ba
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
  - name: sigc++-3.0
    buildsystem: meson
    config-opts:
      - -Dbuild-examples=false
      - -Dbuild-tests=false
    sources:
      - type: archive
        url: https://github.com/libsigcplusplus/libsigcplusplus/releases/download/3.8.1/libsigc++-3.8.1.tar.xz
        sha256: 4ff41d1474e501d3baeced4c989d154338206ac16471e614376496b63fe252d1
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/sigc++-3.0
  - name: glibmm-2.68
    buildsystem: meson
    config-opts:
      - -Dbuild-examples=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/glibmm/2.88/glibmm-2.88.1.tar.xz
        sha256: c139f962b1575c8827cd39d1ac21b7a367be3bda1409c0c7e21a29090f371506
    cleanup:
      - /include
      - /lib/giomm-2.68
      - /lib/glibmm-2.68
      - /lib/pkgconfig
  - name: cairomm-1.16
    buildsystem: meson
    config-opts:
      - -Dbuild-examples=false
      - -Dbuild-tests=false
    sources:
      - type: archive
        url: https://www.cairographics.org/releases/cairomm-1.18.1.tar.xz
        sha256: e0e996a979ee52c840dca3ee74f5d005e3259b94ddce58f255d3b6f47c8cb41d
    cleanup:
      - /include
      - /lib/cairomm-1.16
      - /lib/pkgconfig
  - name: pangomm-2.48
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/pangomm/2.56/pangomm-2.56.2.tar.xz
        sha256: f1e984c85a85b6a0e61616366521f51dd8282a072bb45d15b5084762b62f4c0e
    cleanup:
      - /include
      - /lib/pangomm-2.48
      - /lib/pkgconfig
  - name: gtkmm-4.0
    buildsystem: meson
    config-opts:
      - -Dbuild-demos=false
      - -Dbuild-tests=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtkmm/4.22/gtkmm-4.22.0.tar.xz
        sha256: 2e8a21b4b0725f620e33aaee0cd343ed121b533275b632896619b1c89e96de67
    cleanup:
      - /include
      - /lib/gtkmm-4.0
      - /lib/pkgconfig
  - name: dtranslatebot
    buildsystem: cmake-ninja
    config-opts:
      - -DWITH_GUI=ON
    sources:
      - type: dir
        path: ../
